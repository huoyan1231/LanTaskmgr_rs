name: Generate Changelog

# 在推送形如 v1.0.0 的 tag 时，自动根据从上一个 tag 到当前 tag 的提交
# 生成 CHANGELOG（遵循 Conventional Commits 规范），并把变更内容更新到
# 同名 Release 的 body 中（追加「更新日志」小节，不覆盖原有说明）。
#
# 与 release-portable.yml 解耦：本 workflow 只负责「生成 changelog 并写回 Release」，
# 不编译、不打包、不重新上传产物。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Target tag, e.g. v1.0.0 (required for manual runs)'
        required: true

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag & generate changelog
        id: meta
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          # 找到上一个 v* tag（排除当前 tag）
          PREV=$(git tag --sort=-v:refname --list 'v*' | grep -v "^${TAG}$" | head -1)

          if [ -n "$PREV" ]; then
            echo "prev_tag=${PREV}" >> "$GITHUB_OUTPUT"
            # 用 git log 生成从上个 tag 到当前 tag 的提交列表
            BODY=$(git log ${PREV}..${TAG} --pretty=format:"- %s (%h)" --no-merges)
            # 按类型分组显示
            FEATS=$(git log ${PREV}..${TAG} --pretty=format:"- %s" --grep="^feat" --no-merges)
            FIXES=$(git log ${PREV}..${TAG} --pretty=format:"- %s" --grep="^fix" --no-merges)
            PERFS=$(git log ${PREV}..${TAG} --pretty=format:"- %s" --grep="^perf" --no-merges)
            REFACTORS=$(git log ${PREV}..${TAG} --pretty=format:"- %s" --grep="^refactor" --no-merges)
            SECS=$(git log ${PREV}..${TAG} --pretty=format:"- %s" --grep="^security" --no-merges)
            CIS=$(git log ${PREV}..${TAG} --pretty=format:"- %s" --grep="^ci" --no-merges)
            OTHERS=$(git log ${PREV}..${TAG} --pretty=format:"- %s" --no-merges \
              | grep -vE "^(feat|fix|perf|refactor|security|ci):" || true)

            {
              echo "### What's Changed"
              echo ""
              if [ -n "$FEATS" ]; then echo "**Features**"; echo "$FEATS"; echo ""; fi
              if [ -n "$FIXES" ]; then echo "**Bug Fixes**"; echo "$FIXES"; echo ""; fi
              if [ -n "$PERFS" ]; then echo "**Performance**"; echo "$PERFS"; echo ""; fi
              if [ -n "$REFACTORS" ]; then echo "**Refactoring**"; echo "$REFACTORS"; echo ""; fi
              if [ -n "$SECS" ]; then echo "**Security**"; echo "$SECS"; echo ""; fi
              if [ -n "$CIS" ]; then echo "**CI / Build**"; echo "$CIS"; echo ""; fi
              if [ -n "$OTHERS" ]; then echo "**Other Changes**"; echo "$OTHERS"; echo ""; fi
            } | tee /tmp/changelog.txt

            # 写入 output（多行内容需要特殊处理）
            {
              echo "changelog<<EOF"
              cat /tmp/changelog.txt
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "prev_tag=" >> "$GITHUB_OUTPUT"
            echo "changelog=First release." >> "$GITHUB_OUTPUT"
          fi

      - name: Update Release body with changelog
        if: ${{ steps.meta.outputs.prev_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          body: |
            ## Changelog

            ${{ steps.meta.outputs.changelog }}
          append_body: true
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
